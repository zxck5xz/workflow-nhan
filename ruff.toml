target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "node_modules",
  "**/__pycache__",
  "**/.venv",
  "**/.git",
]

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
