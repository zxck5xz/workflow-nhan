services:
  frontend:
    build:
      context: .
      dockerfile: task-dashboard/Dockerfile
      args:
        # The API is the Cloudflare Worker: run it with `npm run dev:backend`
        # (wrangler dev on :8787, secrets in backend/worker/.dev.vars).
        VITE_API_URL: http://localhost:8787
    ports:
      - '3000:80'

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: task_dash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
