name = "workflow-nhan-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets (set via `wrangler secret put`):
#   DATABASE_URL  - Neon PostgreSQL connection string
#   JWT_SECRET    - JWT signing secret
#   TELEGRAM_BOT_TOKEN - (optional) bot token from @BotFather, for Telegram reminders
#   RESEND_API_KEY, MAIL_FROM - (optional) Resend API key and verified sender, for email reminders

# Environment variables (non-secret)
# Daily deadline reminders: 01:00 UTC = 08:00 in Vietnam
[triggers]
crons = ["0 1 * * *"]

[vars]
# Entries may use `*` within one DNS label; the second entry covers Vercel
# preview deployments (hash and git-branch URLs) of the dashboard.
CORS_ORIGINS = "https://task-dashboard-chi-lemon.vercel.app,https://task-dashboard-*-zxck5xzs-projects.vercel.app,https://workflow-nhan-backend.ai-chat-api.workers.dev,http://localhost:5173,http://localhost:5174"
