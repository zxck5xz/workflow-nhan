name = "workflow-nhan-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets (set via `wrangler secret put`):
#   DATABASE_URL  - Neon PostgreSQL connection string
#   JWT_SECRET    - JWT signing secret

# Environment variables (non-secret)
[vars]
CORS_ORIGINS = "https://task-dashboard-chi-lemon.vercel.app,https://workflow-nhan-backend.ai-chat-api.workers.dev,http://localhost:5173,http://localhost:5174"
